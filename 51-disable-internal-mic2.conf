# The Redrix audio topology exposes the four-channel internal microphone array
# as two stereo sources. Only Mic1 carries usable audio on this machine.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-adl_rt5682_def.HiFi__Mic2__source"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
